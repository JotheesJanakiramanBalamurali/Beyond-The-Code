
name: PR Quality Checks

on:
  pull_request:
    branches:
      - develop

jobs:
  check-html-titles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check HTML files have title tags
        run: |
          for file in *.html; do
            if ! grep -qi "<title>" "$file"; then
              echo "Missing title tag in $file"
              exit 1
            fi
          done

  check-image-alt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check images have alt attributes
        run: |
          if grep -rinE '<img[^>]*>' --include="*.html" | grep -iv 'alt='; then
            echo "An image is missing its alt attribute"
            exit 1
          fi

  check-console-logs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for console.log statements
        run: |
          if grep -rn "console.log" js/ --include="*.js"; then
            echo "Remove console.log statements before merging"
            exit 1
          fi

  quality-check-summary:
    runs-on: ubuntu-latest
    needs:
      - check-html-titles
      - check-image-alt
      - check-console-logs
    steps:
      - name: All quality checks passed
        run: echo "All PR quality checks passed!"
